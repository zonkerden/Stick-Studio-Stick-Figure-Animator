<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Studio — Stick Figure Animator</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#101821;
    --panel-2:#0d141b;
    --line:#1d2a36;
    --text:#e6edf3;
    --muted:#7f8fa0;
    --accent:#5eead4;
    --accent-dim:rgba(94,234,212,.15);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
    flex:0 0 auto;
  }
  header h1{
    margin:0;font-size:14px;font-weight:600;letter-spacing:.02em;
  }
  header h1 span{color:var(--accent);}
  .hint{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right;}

  /* ---------- layout ---------- */
  #app{flex:1 1 auto;display:flex;min-height:0;}

  aside{
    flex:0 0 232px;
    background:var(--panel-2);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:14px;
    display:flex;flex-direction:column;gap:18px;
  }
  aside::-webkit-scrollbar{width:8px;}
  aside::-webkit-scrollbar-thumb{background:#1c2836;border-radius:8px;}

  .group{display:flex;flex-direction:column;gap:8px;}
  .group > label.title{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);font-weight:600;
  }

  .row{display:flex;align-items:center;gap:8px;}
  .row.between{justify-content:space-between;}

  button{
    font:inherit;
    color:var(--text);
    background:#16212c;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    transition:background .12s,border-color .12s,transform .06s;
  }
  button:hover{background:#1c2a37;border-color:#2a3d4d;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent-dim);border-color:rgba(94,234,212,.35);color:var(--accent);}
  button.primary:hover{background:rgba(94,234,212,.24);}
  button:disabled{opacity:.35;cursor:default;transform:none;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:4px;border-radius:4px;background:#22303d;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--accent);
    cursor:pointer;border:2px solid var(--bg);
  }
  input[type=color]{
    width:38px;height:28px;padding:0;border:1px solid var(--line);
    border-radius:6px;background:none;cursor:pointer;
  }
  .val{color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px;text-align:right;font-size:12px;}

  .switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text);}
  .switch input{display:none;}
  .track{
    width:34px;height:18px;border-radius:20px;background:#22303d;
    position:relative;transition:background .15s;flex:0 0 auto;
  }
  .track::after{
    content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
    border-radius:50%;background:#7f8fa0;transition:transform .15s,background .15s;
  }
  .switch input:checked + .track{background:rgba(94,234,212,.3);}
  .switch input:checked + .track::after{transform:translateX(16px);background:var(--accent);}

  /* ---------- stage ---------- */
  main{flex:1 1 auto;position:relative;min-width:0;min-height:0;}
  canvas#stage{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;touch-action:none;cursor:crosshair;
  }

  /* ---------- timeline ---------- */
  #timeline{
    flex:0 0 auto;
    border-top:1px solid var(--line);
    background:var(--panel-2);
    padding:10px 14px 12px;
    display:flex;flex-direction:column;gap:9px;
  }
  .tl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-bar .sep{width:1px;height:22px;background:var(--line);margin:0 3px;}
  .tl-bar .spacer{flex:1;}
  .tl-bar label.fps{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;}
  .tl-bar label.fps input[type=range]{width:96px;}

  #frames{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-height:74px;align-items:center;
  }
  #frames::-webkit-scrollbar{height:8px;}
  #frames::-webkit-scrollbar-thumb{background:#1c2836;border-radius:8px;}

  .frame{
    position:relative;flex:0 0 auto;padding:2px;border-radius:9px;
    background:#0f1821;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .12s,box-shadow .12s;
  }
  .frame:hover{border-color:#2a3d4d;}
  .frame.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px -4px var(--accent);}
  .frame canvas{display:block;border-radius:6px;background:#0b0f14;}
  .frame span{
    position:absolute;bottom:3px;right:5px;font-size:9.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .frame.active span{color:var(--accent);}

  @media (max-width:760px){
    #app{flex-direction:column;}
    aside{flex:0 0 auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--line);gap:14px;}
    .group{flex:0 0 auto;}
    .hint{display:none;}
  }
</style>
</head>
<body>

<header>
  <h1>Stick<span>Studio</span></h1>
  <div class="hint">Drag joints to pose · <b>Space</b> play · <b>← →</b> frames · <b>Shift</b> snaps angle</div>
</header>

<div id="app">
  <aside>
    <div class="group">
      <label class="title">Figure</label>
      <div class="row">
        <span style="color:var(--muted);font-size:12px;">Color</span>
        <input type="color" id="color" value="#7dd3fc">
        <button id="resetPose" style="margin-left:auto;">Reset pose</button>
      </div>
      <div class="row">
        <span style="color:var(--muted);font-size:12px;">Weight</span>
        <input type="range" id="weight" min="2" max="14" step="0.5" value="6">
        <span class="val" id="weightVal">6</span>
      </div>
    </div>

    <div class="group">
      <label class="title">View</label>
      <label class="switch"><input type="checkbox" id="onion" checked><span class="track"></span>Onion skin</label>
      <label class="switch"><input type="checkbox" id="grid" checked><span class="track"></span>Grid</label>
    </div>

    <div class="group">
      <label class="title">Export</label>
      <button id="pngBtn">Save frame as PNG</button>
      <button id="vidBtn">Record loop as WebM</button>
      <div id="recNote" style="color:var(--muted);font-size:11px;line-height:1.35;">
        Recording captures the canvas in real time for one full loop.
      </div>
    </div>
  </aside>

  <main>
    <canvas id="stage"></canvas>
  </main>
</div>

<div id="timeline">
  <div class="tl-bar">
    <button id="playBtn" class="primary" style="min-width:64px;">▶ Play</button>
    <button id="prevBtn" title="Previous frame">◀</button>
    <button id="nextBtn" title="Next frame">▶</button>
    <div class="sep"></div>
    <button id="addBtn">+ Keyframe</button>
    <button id="dupBtn">Duplicate</button>
    <button id="delBtn">Delete</button>
    <div class="spacer"></div>
    <label class="fps">FPS
      <input type="range" id="fps" min="2" max="30" step="1" value="12">
      <span class="val" id="fpsVal">12</span>
    </label>
  </div>
  <div id="frames"></div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   Skeleton definition
   ============================================================ */
const B = { spine:64, neck:24, upperArm:44, lowerArm:42, upperLeg:58, lowerLeg:56 };
const HEAD_R = 15;
const BG = "#0b0f14";

const JOINTS = ["hip","chest","head","lElbow","lHand","rElbow","rHand","lKnee","lFoot","rKnee","rFoot"];

// joint -> [parent joint, pose angle key]
const DRAG_MAP = {
  chest  : ["hip",     "spine"],
  head   : ["chest",   "neck"],
  lElbow : ["chest",   "lUpperArm"],
  lHand  : ["lElbow",  "lLowerArm"],
  rElbow : ["chest",   "rUpperArm"],
  rHand  : ["rElbow",  "rLowerArm"],
  lKnee  : ["hip",     "lUpperLeg"],
  lFoot  : ["lKnee",   "lLowerLeg"],
  rKnee  : ["hip",     "rUpperLeg"],
  rFoot  : ["rKnee",   "rLowerLeg"],
};

const HALF = Math.PI / 2;

function defaultPose(){
  return {
    x: 0, y: 0,
    spine: -HALF,
    neck: -HALF,
    lUpperArm: HALF + 0.30, lLowerArm: HALF + 0.20,
    rUpperArm: HALF - 0.30, rLowerArm: HALF - 0.20,
    lUpperLeg: HALF + 0.12, lLowerLeg: HALF + 0.04,
    rUpperLeg: HALF - 0.12, rLowerLeg: HALF - 0.04,
  };
}

/* ============================================================
   Math helpers
   ============================================================ */
const polar = (len, ang) => ({ x: Math.cos(ang) * len, y: Math.sin(ang) * len });
const add   = (a, b)        => ({ x: a.x + b.x, y: a.y + b.y });

function lerpAngle(a, b, t){
  let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}
function lerpPose(a, b, t){
  const out = {};
  for (const k in a){
    out[k] = (k === "x" || k === "y") ? a[k] + (b[k] - a[k]) * t : lerpAngle(a[k], b[k], t);
  }
  return out;
}

/* Forward kinematics: pose -> joint positions */
function jointsOf(p){
  const hip   = { x: p.x, y: p.y };
  const chest = add(hip,   polar(B.spine,     p.spine));
  const head  = add(chest, polar(B.neck,      p.neck));

  const lElbow = add(chest, polar(B.upperArm, p.lUpperArm));
  const lHand  = add(lElbow, polar(B.lowerArm, p.lLowerArm));
  const rElbow = add(chest, polar(B.upperArm, p.rUpperArm));
  const rHand  = add(rElbow, polar(B.lowerArm, p.rLowerArm));

  const lKnee = add(hip, polar(B.upperLeg, p.lUpperLeg));
  const lFoot = add(lKnee, polar(B.lowerLeg, p.lLowerLeg));
  const rKnee = add(hip, polar(B.upperLeg, p.rUpperLeg));
  const rFoot = add(rKnee, polar(B.lowerLeg, p.rLowerLeg));

  return { hip, chest, head, lElbow, lHand, rElbow, rHand, lKnee, lFoot, rKnee, rFoot };
}

/* ============================================================
   State
   ============================================================ */
let frames = [];
let current = 0;
let playing = false;
let playPos = 0;
let fps = 12;
let onion = true;
let showGrid = true;
let strokeColor = "#7dd3fc";
let lineWidth = 6;

let drag = null;       // { joint, offX, offY }
let hover = null;

/* ============================================================
   Canvas setup
   ============================================================ */
const cv  = document.getElementById("stage");
const ctx = cv.getContext("2d");
const stageWrap = cv.parentElement;
let W = 0, H = 0, DPR = 1;

function resize(){
  const r = stageWrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width);
  H = Math.max(1, r.height);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  render();
}

/* ============================================================
   Drawing
   ============================================================ */
function drawGrid(g){
  if (!showGrid) return;
  g.save();
  g.strokeStyle = "#141e28";
  g.lineWidth = 1;
  const step = 40;
  g.beginPath();
  for (let x = 0; x < W; x += step){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
  for (let y = 0; y < H; y += step){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
  g.stroke();
  g.restore();
}

function drawFigure(g, pose, opts = {}){
  const alpha = opts.alpha ?? 1;
  const width = opts.width ?? lineWidth;
  const color = opts.color ?? strokeColor;
  const J = jointsOf(pose);

  g.save();
  g.globalAlpha = alpha;
  g.lineCap = "round";
  g.lineJoin = "round";
  g.lineWidth = width;
  g.strokeStyle = color;

  const seg = (a, b) => {
    g.beginPath();
    g.moveTo(a.x, a.y);
    g.lineTo(b.x, b.y);
    g.stroke();
  };

  // legs
  seg(J.hip, J.lKnee); seg(J.lKnee, J.lFoot);
  seg(J.hip, J.rKnee); seg(J.rKnee, J.rFoot);
  // arms
  seg(J.chest, J.lElbow); seg(J.lElbow, J.lHand);
  seg(J.chest, J.rElbow); seg(J.rElbow, J.rHand);
  // torso
  seg(J.hip, J.chest);
  // neck (stops at the skull edge)
  const neckEdge = add(J.chest, polar(B.neck - HEAD_R, pose.neck));
  seg(J.chest, neckEdge);
  // head
  g.beginPath();
  g.arc(J.head.x, J.head.y, HEAD_R, 0, Math.PI * 2);
  g.fillStyle = BG;
  g.fill();
  g.strokeStyle = color;
  g.stroke();

  g.restore();
}

function drawHandles(pose){
  const J = jointsOf(pose);
  ctx.save();
  for (const k of JOINTS){
    const p = J[k];
    const active = (drag && drag.joint === k) || hover === k;
    ctx.beginPath();
    ctx.arc(p.x, p.y, active ? 7 : 4.5, 0, Math.PI * 2);
    ctx.fillStyle = active ? "rgba(94,234,212,.95)" : "rgba(125,211,252,.3)";
    ctx.fill();
  }
  ctx.restore();
}

function poseAt(u){
  const n = frames.length;
  if (n === 0) return null;
  if (n === 1) return frames[0];
  const i = Math.floor(u) % n;
  const j = (i + 1) % n;
  return lerpPose(frames[i], frames[j], u - Math.floor(u));
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);

  if (!frames.length) return;

  let pose, ghost = null;

  if (playing){
    pose = poseAt(playPos);
    if (onion && frames.length > 1){
      const i = Math.floor(playPos) % frames.length;
      ghost = frames[(i - 1 + frames.length) % frames.length];
    }
  } else {
    pose = frames[current];
    if (onion && current > 0) ghost = frames[current - 1];
  }

  if (ghost) drawFigure(ctx, ghost, { alpha: .2, width: lineWidth * .8 });
  drawFigure(ctx, pose, { alpha: 1, width: lineWidth });
  if (!playing) drawHandles(pose);
}

/* ============================================================
   Thumbnails
   ============================================================ */
const THUMB_W = 46, THUMB_H = 56;

function drawThumb(canvas, pose){
  const dpr = 2;
  const g = canvas.getContext("2d");
  canvas.width = THUMB_W * dpr;
  canvas.height = THUMB_H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, THUMB_W, THUMB_H);

  const J = jointsOf(pose);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const k in J){
    const p = J[k];
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  minX -= HEAD_R; maxX += HEAD_R; minY -= HEAD_R; maxY += HEAD_R;

  const pw = Math.max(1, maxX - minX), ph = Math.max(1, maxY - minY);
  const s = Math.min((THUMB_W - 10) / pw, (THUMB_H - 10) / ph);

  g.save();
  g.translate(THUMB_W / 2, THUMB_H / 2);
  g.scale(s, s);
  g.translate(-(minX + maxX) / 2, -(minY + maxY) / 2);
  drawFigure(g, pose, { color: strokeColor, width: 2.2 / s });
  g.restore();
}

/* ============================================================
   Timeline UI
   ============================================================ */
const framesEl = document.getElementById("frames");

function rebuildTimeline(){
  framesEl.innerHTML = "";
  frames.forEach((pose, i) => {
    const btn = document.createElement("button");
    btn.className = "frame" + (i === current ? " active" : "");
    btn.dataset.i = String(i);

    const c = document.createElement("canvas");
    c.style.width = THUMB_W + "px";
    c.style.height = THUMB_H + "px";

    const num = document.createElement("span");
    num.textContent = String(i + 1);

    btn.append(c, num);
    btn.addEventListener("click", () => {
      if (playing) stopPlayback();
      current = i;
      updateActive();
      render();
    });

    framesEl.appendChild(btn);
    drawThumb(c, pose);
  });
  updateActive();
}

function updateActive(){
  [...framesEl.children].forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

function refreshThumb(i){
  const el = framesEl.children[i];
  if (!el) return;
  drawThumb(el.querySelector("canvas"), frames[i]);
}

/* ============================================================
   Pointer interaction
   ============================================================ */
function toWorld(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function nearestJoint(world, pose, threshold = 20){
  const J = jointsOf(pose);
  let best = null, bestD = threshold;
  for (const k of JOINTS){
    const p = J[k];
    const d = Math.hypot(p.x - world.x, p.y - world.y);
    if (d < bestD){ bestD = d; best = k; }
  }
  return best;
}

cv.addEventListener("pointerdown", (e) => {
  if (playing) return;
  const w = toWorld(e);
  const pose = frames[current];
  const j = nearestJoint(w, pose);
  if (!j) return;

  drag = { joint: j, offX: pose.x - w.x, offY: pose.y - w.y };
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = "grabbing";
  render();
});

cv.addEventListener("pointermove", (e) => {
  const w = toWorld(e);

  if (!drag){
    const j = nearestJoint(w, frames[current]);
    if (j !== hover){ hover = j; render(); }
    cv.style.cursor = j ? "grab" : "crosshair";
    return;
  }

  const pose = frames[current];

  if (drag.joint === "hip"){
    pose.x = w.x + drag.offX;
    pose.y = w.y + drag.offY;
  } else {
    const [parentKey, bone] = DRAG_MAP[drag.joint];
    const parent = jointsOf(pose)[parentKey];
    let ang = Math.atan2(w.y - parent.y, w.x - parent.x);
    if (e.shiftKey) ang = Math.round(ang / (Math.PI / 12)) * (Math.PI / 12);
    pose[bone] = ang;
  }

  render();
  refreshThumb(current);
});

function endDrag(e){
  if (!drag) return;
  drag = null;
  cv.style.cursor = "crosshair";
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  render();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("pointerleave", () => {
  if (!drag && hover){ hover = null; render(); }
});

/* ============================================================
   Playback
   ============================================================ */
let rafId = null;
let playStart = 0;
let lastIdx = -1;

function tick(now){
  if (!playing) return;
  const elapsed = (now - playStart) / 1000;
  const total = frames.length / fps;
  playPos = ((elapsed % total) / total) * frames.length;

  const idx = Math.floor(playPos) % frames.length;
  if (idx !== lastIdx){
    lastIdx = idx;
    current = idx;
    updateActive();
    const el = framesEl.children[idx];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  render();
  rafId = requestAnimationFrame(tick);
}

function startPlayback(){
  if (playing || frames.length === 0) return;
  playing = true;
  lastIdx = -1;
  playStart = performance.now();
  playBtn.textContent = "❚❚ Pause";
  rafId = requestAnimationFrame(tick);
}

function stopPlayback(){
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  playBtn.textContent = "▶ Play";
  current = Math.min(current, frames.length - 1);
  updateActive();
  render();
}

/* ============================================================
   Frame operations
   ============================================================ */
function addFrame(copyCurrent){
  if (playing) stopPlayback();
  const base = copyCurrent ? frames[current] : defaultPose();
  const pose = Object.assign({}, base);
  if (!copyCurrent){
    pose.x = W / 2;
    pose.y = H * 0.62;
  }
  frames.splice(current + 1, 0, pose);
  current += 1;
  rebuildTimeline();
  render();
}

function deleteFrame(){
  if (playing) stopPlayback();
  if (frames.length <= 1) return;
  frames.splice(current, 1);
  current = Math.max(0, Math.min(current, frames.length - 1));
  rebuildTimeline();
  render();
}

function goTo(i){
  if (playing) stopPlayback();
  current = (i + frames.length) % frames.length;
  updateActive();
  render();
}

/* ============================================================
   Export
   ============================================================ */
function exportPNG(){
  const scale = 2;
  const c = document.createElement("canvas");
  c.width = Math.round(W * scale);
  c.height = Math.round(H * scale);
  const g = c.getContext("2d");
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.fillStyle = BG;
  g.fillRect(0, 0, W, H);
  drawFigure(g, frames[current], { width: lineWidth });

  const a = document.createElement("a");
  a.download = "stick-frame-" + (current + 1) + ".png";
  a.href = c.toDataURL("image/png");
  a.click();
}

function exportVideo(){
  if (typeof MediaRecorder === "undefined" || !cv.captureStream){
    recNote.textContent = "Video recording isn't supported in this browser.";
    return;
  }
  if (frames.length < 2){
    recNote.textContent = "Add at least 2 keyframes to record a loop.";
    return;
  }
  if (playing) stopPlayback();

  let mime = "video/webm;codecs=vp9";
  if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm;codecs=vp8";
  if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";

  const stream = cv.captureStream(30);
  let rec;
  try {
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  } catch (err){
    recNote.textContent = "Couldn't start the recorder.";
    return;
  }

  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "stick-loop.webm";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    vidBtn.disabled = false;
    vidBtn.textContent = "Record loop as WebM";
    recNote.textContent = "Saved! Import the .webm into any editor.";
  };

  vidBtn.disabled = true;
  vidBtn.textContent = "● Recording…";
  recNote.textContent = "Recording one full loop…";

  startPlayback();
  rec.start();

  const durationMs = (frames.length / fps) * 1000 + 120;
  setTimeout(() => {
    if (rec.state !== "inactive") rec.stop();
    stopPlayback();
  }, durationMs);
}

/* ============================================================
   UI wiring
   ============================================================ */
const playBtn  = document.getElementById("playBtn");
const prevBtn  = document.getElementById("prevBtn");
const nextBtn  = document.getElementById("nextBtn");
const addBtn   = document.getElementById("addBtn");
const dupBtn   = document.getElementById("dupBtn");
const delBtn   = document.getElementById("delBtn");
const fpsInput = document.getElementById("fps");
const fpsVal   = document.getElementById("fpsVal");
const vidBtn   = document.getElementById("vidBtn");
const recNote  = document.getElementById("recNote");

playBtn.addEventListener("click", () => playing ? stopPlayback() : startPlayback());
prevBtn.addEventListener("click", () => goTo(current - 1));
nextBtn.addEventListener("click", () => goTo(current + 1));
addBtn.addEventListener("click", () => addFrame(false));
dupBtn.addEventListener("click", () => addFrame(true));
delBtn.addEventListener("click", deleteFrame);

fpsInput.addEventListener("input", () => {
  fps = Number(fpsInput.value);
  fpsVal.textContent = String(fps);
});

document.getElementById("color").addEventListener("input", (e) => {
  strokeColor = e.target.value;
  rebuildTimeline();
  render();
});

const weightInput = document.getElementById("weight");
const weightVal = document.getElementById("weightVal");
weightInput.addEventListener("input", () => {
  lineWidth = Number(weightInput.value);
  weightVal.textContent = String(lineWidth);
  render();
});

document.getElementById("onion").addEventListener("change", (e) => { onion = e.target.checked; render(); });
document.getElementById("grid").addEventListener("change",  (e) => { showGrid = e.target.checked; render(); });

document.getElementById("resetPose").addEventListener("click", () => {
  const p = defaultPose();
  p.x = W / 2;
  p.y = H * 0.62;
  frames[current] = p;
  refreshThumb(current);
  render();
});

document.getElementById("pngBtn").addEventListener("click", exportPNG);
vidBtn.addEventListener("click", exportVideo);

// keyboard
window.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  if (e.code === "Space"){ e.preventDefault(); playing ? stopPlayback() : startPlayback(); }
  else if (e.code === "ArrowLeft"){ e.preventDefault(); goTo(current - 1); }
  else if (e.code === "ArrowRight"){ e.preventDefault(); goTo(current + 1); }
  else if (e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); deleteFrame(); }
});

/* ============================================================
   Boot
   ============================================================ */
function boot(){
  const p = defaultPose();
  p.x = W / 2;
  p.y = H * 0.62;
  frames = [p];
  current = 0;
  rebuildTimeline();
  render();
}

const ro = new ResizeObserver(resize);
ro.observe(stageWrap);

resize();
boot();

})();
</script>
